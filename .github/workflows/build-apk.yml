name: Build OneStake APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q OneStakeSelectionAI_v0.1.zip -d buildsrc
          ls -la buildsrc/OneStakeSelectionAI

      - name: Align Java and Kotlin to JVM 17
        run: python3 -c "from pathlib import Path; p=Path('buildsrc/OneStakeSelectionAI/app/build.gradle.kts'); s=p.read_text(); old='    compileSdk = 35\\n'; new='    compileSdk = 35\\n\\n    compileOptions {\\n        sourceCompatibility = org.gradle.api.JavaVersion.VERSION_17\\n        targetCompatibility = org.gradle.api.JavaVersion.VERSION_17\\n    }\\n'; p.write_text(s if 'compileOptions {' in s else s.replace(old,new,1)); print(p.read_text())"

      - name: Patch OCR parser for bookmaker cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          data = ''' '''
          p = Path('buildsrc/OneStakeSelectionAI/app/src/main/java/com/onestake/selectionai/OcrParser.kt')
          p.write_bytes(base64.b64decode(data))
          print('Patched', p)
          PY

      - name: Build APK
        working-directory: buildsrc/OneStakeSelectionAI
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneStake-SelectionAI-v0.2-APK
          path: buildsrc/OneStakeSelectionAI/app/build/outputs/apk/debug/app-debug.apk
