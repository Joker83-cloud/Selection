name: Build OneStake APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: onestake-selectionai-debug-keystore-v1

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q OneStakeSelectionAI_v0.1.zip -d buildsrc

      - name: Align Java/Kotlin and set unique stable app id
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('buildsrc/OneStakeSelectionAI/app/build.gradle.kts')
          s = p.read_text()
          old = '    compileSdk = 35\n'
          new = '    compileSdk = 35\n\n    compileOptions {\n        sourceCompatibility = org.gradle.api.JavaVersion.VERSION_17\n        targetCompatibility = org.gradle.api.JavaVersion.VERSION_17\n    }\n'
          if 'compileOptions {' not in s:
              s = s.replace(old, new, 1)
          s = s.replace('applicationId = "com.onestake.selectionai"', 'applicationId = "com.onestake.selectionai.stable"')
          p.write_text(s)
          PY

      - name: Apply Selection AI v0.3 patches
        run: |
          cp patches/OcrParser.kt buildsrc/OneStakeSelectionAI/app/src/main/java/com/onestake/selectionai/OcrParser.kt
          cp patches/MainActivity.kt buildsrc/OneStakeSelectionAI/app/src/main/java/com/onestake/selectionai/MainActivity.kt

      - name: Build APK
        working-directory: buildsrc/OneStakeSelectionAI
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneStake-SelectionAI-v0.3-clean-install-APK
          path: buildsrc/OneStakeSelectionAI/app/build/outputs/apk/debug/app-debug.apk
