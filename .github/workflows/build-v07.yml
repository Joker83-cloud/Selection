name: Build OneStake v0.9

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/onestake-selectionai.keystore
          key: onestake-selectionai-signing-v3

      - name: Verify signing key exists
        run: test -f "$HOME/.android/onestake-selectionai.keystore"

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q OneStakeSelectionAI_v0.1.zip -d buildsrc

      - name: Configure project and stable signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          old_workflow = Path('.github/workflows/build-apk.yml').read_text()
          password_match = re.search(r"-storepass '([^']+)'", old_workflow)
          alias_match = re.search(r"-alias\s+([^\\\s]+)", old_workflow)
          if not password_match or not alias_match:
              raise SystemExit('Unable to recover existing stable signing configuration')
          password = password_match.group(1)
          alias = alias_match.group(1)

          p = Path('buildsrc/OneStakeSelectionAI/app/build.gradle.kts')
          s = p.read_text()
          if 'compileOptions {' not in s:
              s = s.replace(
                  '    compileSdk = 35\n',
                  '    compileSdk = 35\n\n    compileOptions {\n        sourceCompatibility = org.gradle.api.JavaVersion.VERSION_17\n        targetCompatibility = org.gradle.api.JavaVersion.VERSION_17\n    }\n',
                  1
              )
          s = s.replace(
              'applicationId = "com.onestake.selectionai"',
              'applicationId = "com.onestake.selectionai.v3"'
          )
          marker = '    buildFeatures { compose = true }'
          signing = f'''    signingConfigs {{
              create("oneStakeFixed") {{
                  storeFile = file(System.getProperty("user.home") + "/.android/onestake-selectionai.keystore")
                  storePassword = "{password}"
                  keyAlias = "{alias}"
                  keyPassword = "{password}"
              }}
          }}

          buildTypes {{
              getByName("debug") {{
                  signingConfig = signingConfigs.getByName("oneStakeFixed")
              }}
          }}

          '''
          if 'oneStakeFixed' not in s:
              s = s.replace(marker, signing + marker, 1)
          p.write_text(s)
          PY

      - name: Apply app patches
        run: |
          SRC=buildsrc/OneStakeSelectionAI/app/src/main/java/com/onestake/selectionai
          cp patches/OcrParser.kt "$SRC/OcrParser.kt"
          cp patches/MainActivity.kt "$SRC/MainActivity.kt"
          cp patches/ApiFootballClient.kt "$SRC/ApiFootballClient.kt"
          cp patches/ScoringEngine.kt "$SRC/ScoringEngine.kt"
          cp patches/DirettaMobileClient.kt "$SRC/DirettaMobileClient.kt"
          cp patches/HybridFootballClient.kt "$SRC/HybridFootballClient.kt"
          python3 - <<'PY'
          from pathlib import Path

          src = Path('buildsrc/OneStakeSelectionAI/app/src/main/java/com/onestake/selectionai')
          p = src / 'MainActivity.kt'
          s = p.read_text()
          s = s.replace('ApiFootballClient(apiKey).enrich(item, date)', 'DirettaMobileClient().enrich(item, date)')
          s = s.replace('item.copy(notes = "API: ${e.message}")', 'item.copy(notes = "Diretta non disponibile: ${e.message}")')
          s = s.replace('''                        if (apiKey.isBlank()) {
                            status = "Inserisci prima la API key nella scheda DATI."
                            return@launch
                        }
''', '')
          s = s.replace('Text(if (apiKey.isBlank()) "🔑 INSERISCI API KEY" else "⚡ ANALIZZA TUTTE ($eligibleCount)")', 'Text("⚡ ANALIZZA TUTTE ($eligibleCount)")')
          s = s.replace('apiEnabled = apiKey.isNotBlank(),', 'apiEnabled = true,')
          s = s.replace('Inserisci la tua API key API-Football. Viene salvata solo sul dispositivo.', 'Fonte dati: Diretta.it. Nessuna API key richiesta.')
          s = s.replace('label = { Text("API-Football key") }', 'label = { Text("API key non utilizzata") }')
          s = s.replace('Text("SALVA API KEY")', 'Text("DATI DA DIRETTA.IT")')
          p.write_text(s)

          p = src / 'DirettaMobileClient.kt'
          s = p.read_text()
          old = '''        val today = fetchDay(0)
        val match = findLeagueMatch(today, candidate)
            ?: return candidate.copy(notes = mergeNote(candidate.notes, "Diretta: partita non identificata nella pagina mobile di oggi"))
'''
          new = '''        var match: LeagueMatch? = null
        var matchedOffset: Int? = null
        val offsets = listOf(0, 1, 2, 3, 4, 5, 6, 7, -1, -2)
        for (offset in offsets) {
            val html = runCatching { fetchDay(offset) }.getOrNull() ?: continue
            val found = findLeagueMatch(html, candidate)
            if (found != null) {
                match = found
                matchedOffset = offset
                break
            }
        }
        val resolvedMatch = match
            ?: return candidate.copy(notes = mergeNote(candidate.notes, "Diretta: partita non identificata tra oggi e i prossimi 7 giorni"))
'''
          if old not in s:
              raise SystemExit('Diretta match lookup block not found')
          s = s.replace(old, new, 1)
          s = s.replace('match.standingsUrl?.let { url ->', 'resolvedMatch.standingsUrl?.let { url ->')
          s = s.replace('match.leagueName.hashCode()', 'resolvedMatch.leagueName.hashCode()')
          s = s.replace('${match.leagueName}', '${resolvedMatch.leagueName}')
          s = s.replace('leagueName = match.leagueName,', 'leagueName = resolvedMatch.leagueName,')
          s = s.replace('Mozilla/5.0 (Android) OneStakeSelectionAI/0.8', 'Mozilla/5.0 (Android) OneStakeSelectionAI/0.9')
          s = s.replace('Diretta mobile · ${resolvedMatch.leagueName} · classifica, ultime 5 e casa/trasferta recuperati', 'Diretta · ${resolvedMatch.leagueName} · classifica, ultime 5 e casa/trasferta recuperati')
          s = s.replace('Diretta mobile · ${resolvedMatch.leagueName} · mancanti:', 'Diretta · ${resolvedMatch.leagueName} · mancanti:')
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: buildsrc/OneStakeSelectionAI
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneStake-SelectionAI-v0.9-diretta-only-APK
          path: buildsrc/OneStakeSelectionAI/app/build/outputs/apk/debug/app-debug.apk
