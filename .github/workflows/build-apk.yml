name: Build OneStake APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q OneStakeSelectionAI_v0.1.zip -d buildsrc
          ls -la buildsrc/OneStakeSelectionAI

      - name: Align Java and Kotlin to JVM 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('buildsrc/OneStakeSelectionAI/app/build.gradle.kts')
          s = p.read_text()
          if 'compileOptions {' not in s:
              needle = '    compileSdk = 35\n'
              replacement = '''    compileSdk = 35

    compileOptions {
        sourceCompatibility = org.gradle.api.JavaVersion.VERSION_17
        targetCompatibility = org.gradle.api.JavaVersion.VERSION_17
    }
'''
              if needle not in s:
                  raise SystemExit('compileSdk marker not found')
              s = s.replace(needle, replacement, 1)
              p.write_text(s)
          print(p.read_text())
          PY

      - name: Build APK
        working-directory: buildsrc/OneStakeSelectionAI
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneStake-SelectionAI-APK
          path: buildsrc/OneStakeSelectionAI/app/build/outputs/apk/debug/app-debug.apk
