name: Build OneStake APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore OneStake signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/onestake-selectionai.keystore
          key: onestake-selectionai-signing-v3

      - name: Ensure OneStake signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/onestake-selectionai.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/onestake-selectionai.keystore" \
              -storepass 'OneStakeLocal2026!' \
              -keypass 'OneStakeLocal2026!' \
              -alias onestake \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=OneStake Selection AI,O=OneStake,C=IT'
          fi
          keytool -list -v \
            -keystore "$HOME/.android/onestake-selectionai.keystore" \
            -storepass 'OneStakeLocal2026!' \
            -alias onestake | grep -E 'SHA1:|SHA256:'

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q OneStakeSelectionAI_v0.1.zip -d buildsrc

      - name: Configure Java, permanent app id and explicit signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('buildsrc/OneStakeSelectionAI/app/build.gradle.kts')
          s = p.read_text()
          old = '    compileSdk = 35\n'
          new = '    compileSdk = 35\n\n    compileOptions {\n        sourceCompatibility = org.gradle.api.JavaVersion.VERSION_17\n        targetCompatibility = org.gradle.api.JavaVersion.VERSION_17\n    }\n'
          if 'compileOptions {' not in s:
              s = s.replace(old, new, 1)
          s = s.replace('applicationId = "com.onestake.selectionai"', 'applicationId = "com.onestake.selectionai.v3"')
          marker = '    buildFeatures { compose = true }'
          signing = '''    signingConfigs {\n        create("oneStakeFixed") {\n            storeFile = file(System.getProperty("user.home") + "/.android/onestake-selectionai.keystore")\n            storePassword = "OneStakeLocal2026!"\n            keyAlias = "onestake"\n            keyPassword = "OneStakeLocal2026!"\n        }\n    }\n\n    buildTypes {\n        getByName("debug") {\n            signingConfig = signingConfigs.getByName("oneStakeFixed")\n        }\n    }\n\n'''
          if 'oneStakeFixed' not in s:
              s = s.replace(marker, signing + marker, 1)
          p.write_text(s)
          PY

      - name: Apply Selection AI patches
        run: |
          cp patches/OcrParser.kt buildsrc/OneStakeSelectionAI/app/src/main/java/com/onestake/selectionai/OcrParser.kt
          cp patches/MainActivity.kt buildsrc/OneStakeSelectionAI/app/src/main/java/com/onestake/selectionai/MainActivity.kt

      - name: Build APK
        working-directory: buildsrc/OneStakeSelectionAI
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneStake-SelectionAI-v0.5-v3-stable-signing-APK
          path: buildsrc/OneStakeSelectionAI/app/build/outputs/apk/debug/app-debug.apk
